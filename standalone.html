    function sanitize(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
    }

    const BANNED_WORDS = ['바보', '멍청이', '꺼져', '닥쳐', '미친', '쓰레기', '틀딱', '잼민이', '급식충', '한남', '한녀', '노답', '병신', '지랄', '존나', '씨발', 'ㅅㅂ', 'ㅂㅅ', 'ㅈㄹ'];
    function filterCleanText(text) {
      if (!text) return { isClean: true, text: '', found: [] };
      let res = text;
      const found = [];
      BANNED_WORDS.forEach(w => {
        const regex = new RegExp(w, 'gi');
        if (regex.test(res)) {
          found.push(w);
          res = res.replace(regex, '🌱(클린)');
        }
      });
      return { isClean: found.length === 0, text: res, found };
    }

                        <button onclick="handleReaction('${issue.id}', '${c.id}', 'insightful')" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs font-bold hover:bg-amber-100 text-slate-600 dark:text-slate-300">

                        </button>
                      </div>
                    </div>
                  `).join('')}
              </div>

            </div>

          </div>
        `;
        return;

      // 메인 목록 뷰 필터링
      const filtered = appState.issues.filter(issue => {
        if (appState.showBookmarksOnly && !appState.bookmarks.includes(issue.id)) return false;
        if (appState.selectedCategory !== 'all' && issue.category !== appState.selectedCategory) return false;
        if (appState.selectedKeyword && !issue.keywords.includes(appState.selectedKeyword)) return false;
        if (appState.searchQuery.trim()) {
          const q = appState.searchQuery.toLowerCase().trim();
          const match = issue.title.toLowerCase().includes(q) ||
                        issue.subtitle.toLowerCase().includes(q) ||
                        issue.summary.toLowerCase().includes(q) ||
                        issue.keywords.some(k => k.toLowerCase().includes(q));
          if (!match) return false;
        }
        return true;
      });

      // 카테고리별 건수 계산
      const counts = { all: appState.issues.length };
      CATEGORIES.forEach(cat => {
        if (cat.id !== 'all') {
          counts[cat.id] = appState.issues.filter(i => i.category === cat.id).length;

      });

          <!-- 상단 히어로 배너 -->

            </p>

              type="text"

              class="w-full pl-11 pr-10 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
            />
            <span class="absolute left-4 top-3.5 text-slate-400 text-base">🔍</span>
            ${appState.searchQuery ? `
              <button onclick="clearSearch()" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            ` : ''}
          </div>

          <!-- 분야별 카테고리 탭 (법, 경제, 정치, 교육, 환경·기술, 사회) -->
          <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
            ${CATEGORIES.map(cat => {
              const isSel = appState.selectedCategory === cat.id;
              const count = counts[cat.id] || 0;
              return `
                <button
                  onclick="selectCategory('${cat.id}')"
                  class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap transition-all shrink-0 ${
                    isSel
                      ? 'bg-slate-900 text-white shadow-md dark:bg-emerald-500 dark:text-slate-950 scale-105 font-bold'
                      : 'bg-white text-slate-600 hover:bg-slate-100 dark:bg-slate-800 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                  }"
                >
                  <span>${cat.icon}</span>
                  <span>${cat.name}</span>
                  <span class="text-xs px-2 py-0.5 rounded-full font-bold ${
                    isSel ? 'bg-slate-800 text-emerald-300 dark:bg-emerald-600 dark:text-slate-950' : 'bg-slate-100 text-slate-500 dark:bg-slate-700'
                  }">
                    ${count}
                  </span>
                </button>
              `;
            }).join('')}
          </div>

            </div>
            <div class="flex flex-wrap gap-1.5 sm:gap-2">
              ${POPULAR_KEYWORDS.map(kw => {
                const isSel = appState.selectedKeyword === kw;

                  <button
                    onclick="selectKeyword('${isSel ? '' : kw}')"
                    class="px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all ${
                      isSel
                        ? 'bg-emerald-500 text-white shadow-sm ring-2 ring-emerald-400 scale-105'

              <span>
                ${appState.showBookmarksOnly ? '📌 내가 저장한 관심 이슈' : appState.selectedCategory === 'all' ? '🔥 전체 시사 이슈 목록' : `📂 ${CATEGORIES.find(c => c.id === appState.selectedCategory)?.name} 이슈`}

              <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700">

                const totalV = (issue.initialVotes?.pro || 0) + (issue.initialVotes?.con || 0) + (issue.initialVotes?.neutral || 0) || 1;
                const pPct = Math.round(((issue.initialVotes?.pro || 0) / totalV) * 100);
                const cPct = Math.round(((issue.initialVotes?.con || 0) / totalV) * 100);
                const nPct = 100 - pPct - cPct;
                const isBm = appState.bookmarks.includes(issue.id);

                return `
                  <div class="flex flex-col bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-xl hover:border-emerald-400 transition-all overflow-hidden group">
                    
                    <!-- 카드 상단 -->
                    <div class="p-5 pb-2 flex justify-between items-center">
                      <span class="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300">
                        ${sanitize(issue.categoryName)}
                      </span>
                      <button onclick="toggleBookmark('${issue.id}')" class="p-1.5 rounded-full text-base ${isBm ? 'text-amber-500' : 'text-slate-300 hover:text-slate-500'}" title="저장">
                        ${isBm ? '⭐' : '☆'}
                      </button>
                    </div>

                    <!-- 카드 본문 클릭 시 상세 이동 -->
                    <div onclick="selectIssue('${issue.id}')" class="px-5 flex-1 cursor-pointer">
                      <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white mb-1.5 line-clamp-2 group-hover:text-emerald-600 transition-colors">
                        ${sanitize(issue.title)}
                      </h3>
                      <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 line-clamp-1">${sanitize(issue.subtitle)}</p>
                      <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 line-clamp-2 mb-4 leading-relaxed">${sanitize(issue.summary)}</p>

                      <!-- 미니 밸런스 게이지 -->
                      <div class="mb-4 bg-slate-50 dark:bg-slate-900 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
                        <div class="flex justify-between text-[11px] font-bold mb-1">
                          <span class="text-emerald-600">찬성 ${pPct}%</span>
                          <span class="text-slate-400">중립 ${nPct}%</span>
                          <span class="text-rose-600">반대 ${cPct}%</span>
                        </div>
                        <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden flex">
                          <div style="width: ${pPct}%" class="bg-emerald-500 h-full"></div>
                          <div style="width: ${nPct}%" class="bg-slate-400 h-full"></div>
                          <div style="width: ${cPct}%" class="bg-rose-500 h-full"></div>
                        </div>
                      </div>
                    </div>

                    <!-- 카드 하단 메타 -->
                    <div class="px-5 pb-4 pt-1 mt-auto border-t border-slate-100 dark:border-slate-700/60 flex flex-col gap-2">
                      <div class="flex flex-wrap gap-1">
                        ${issue.keywords.slice(0, 3).map(kw => `
                          <button onclick="selectKeyword('${kw}')" class="text-[11px] font-medium px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-emerald-100">
                            ${sanitize(kw)}
                          </button>
                        `).join('')}
                      </div>
                      <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>🗳️ ${totalV}명 참여 · 💬 ${(issue.initialComments || []).length}개</span>
                        <button onclick="selectIssue('${issue.id}')" class="font-bold text-emerald-600 dark:text-emerald-400 hover:underline">
                          비교하기 →
                        </button>
                      </div>
                    </div>

                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    /**
     * [이벤트 핸들러 함수들]
     */
    function goToList() {
      appState.selectedIssueId = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectIssue(id) {
      appState.selectedIssueId = id;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectCategory(catId) {
      appState.selectedCategory = catId;
      appState.selectedIssueId = null;
      render();
    }

    function selectKeyword(kw) {
      appState.selectedKeyword = kw;
      appState.selectedIssueId = null;
      render();
    }

    function handleSearchInput(val) {
      appState.searchQuery = val;
      render();
    }

    function clearSearch() {
      appState.searchQuery = '';
      render();
    }

    function resetFilters() {
      appState.selectedCategory = 'all';
      appState.selectedKeyword = '';
      appState.searchQuery = '';
      appState.showBookmarksOnly = false;
      appState.selectedIssueId = null;
      render();
    }

    function toggleBookmark(id) {
      if (appState.bookmarks.includes(id)) {
        appState.bookmarks = appState.bookmarks.filter(x => x !== id);
      } else {
        appState.bookmarks.push(id);
      }
      saveState();
      render();
    }

    function handleVote(issueId, voteType) {
      const prevVote = appState.userVotes[issueId]?.voteType;
      appState.issues = appState.issues.map(iss => {
        if (iss.id === issueId) {
          const v = { ...iss.initialVotes };
          if (prevVote && v[prevVote] > 0) v[prevVote] -= 1;
          v[voteType] = (v[voteType] || 0) + 1;
          return { ...iss, initialVotes: v };
        }
        return iss;
      });

      appState.userVotes[issueId] = { voteType, votedAt: new Date().toISOString() };
      saveState();
      render();
    }

    function setCommentSide(side) {
      appState.commentSide = side;
      render();
    }

    function setCommentTab(tab) {
      appState.commentTab = tab;
      render();
    }

    function refreshNickname() {
      appState.commentNickname = getRandomNickname();
      render();
    }

    function submitComment(e, issueId) {
      e.preventDefault();
      const contentInput = document.getElementById('comment-content');
      const nicknameInput = document.getElementById('comment-nickname');
      const avatarSelect = document.getElementById('comment-avatar');

      const rawContent = contentInput ? contentInput.value.trim() : '';
      if (!rawContent) {
        alert('토론 의견을 입력해 주세요.');
        return;
      }

      const { isClean, text, found } = filterCleanText(rawContent);
      if (!isClean) {
        alert(`건전한 토론을 위해 부적절한 단어('${found.join(', ')}')가 순화 처리되었습니다.`);
      }

      const newC = {
        id: `c_${Date.now()}`,
        side: appState.commentSide,
        nickname: nicknameInput ? nicknameInput.value.trim() : '익명 토론자',
        avatar: avatarSelect ? avatarSelect.value : '🦉',
        content: text,
        createdAt: '방금 전',
        logicalCount: 0,
        insightfulCount: 0
      };

      appState.issues = appState.issues.map(iss => {
        if (iss.id === issueId) {
          return { ...iss, initialComments: [newC, ...(iss.initialComments || [])] };
        }
        return iss;
      });

      saveState();
      render();
    }

    function handleReaction(issueId, commentId, type) {
      appState.issues = appState.issues.map(iss => {
        if (iss.id === issueId) {
          const newC = (iss.initialComments || []).map(c => {
            if (c.id === commentId) {
              if (type === 'logical') return { ...c, logicalCount: (c.logicalCount || 0) + 1 };
              return { ...c, insightfulCount: (c.insightfulCount || 0) + 1 };
            }
            return c;
          });
          return { ...iss, initialComments: newC };
        }
        return iss;
      });
      saveState();
      render();
    }

    // 헤더 버튼 리스너 바인딩
    document.getElementById('btn-logo').addEventListener('click', goToList);
    document.getElementById('btn-toggle-bookmark').addEventListener('click', () => {
      appState.showBookmarksOnly = !appState.showBookmarksOnly;
      appState.selectedIssueId = null;
      render();
    });
    document.getElementById('btn-open-about').addEventListener('click', showAboutModal);
    document.getElementById('btn-open-guide').addEventListener('click', showGuideModal);
    document.getElementById('btn-toggle-theme').addEventListener('click', () => {
      appState.isDarkMode = !appState.isDarkMode;
      if (appState.isDarkMode) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '🌙';
      }
    });

    // 앱 최초 실행
    render();
  </script>
</body>
</html>
